spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gastos_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-days: ${JWT_EXPIRATION_DAYS:30}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
